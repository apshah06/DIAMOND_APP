<body>

<header class="top">
  <div class="top-inner">
    <div class="wordmark">
      <span class="gem">💎</span>
      <div><h1 class="serif">Stock &amp; Purchase Register</h1></div>
      <span class="sub">— diamond inventory</span>
    </div>
    <button class="icon-btn" id="themeToggle" title="Toggle theme" aria-label="Toggle theme">◐</button>
  </div>
  <nav class="tabs" id="tabStrip">
    <button data-tab="stock" class="active">Stock</button>
    <button data-tab="purchases">Purchases</button>
  </nav>
</header>

<main>

  <!-- STOCK -->
  <section class="panel active" id="panel-stock">
    <div class="section-head">
      <h2 class="serif">Stock<span class="count" id="stockCount"></span></h2>
      <div class="head-actions">
        <button class="btn small" data-export="csv" data-source="stock">⬇ CSV</button>
        <button class="btn small" data-export="xlsx" data-source="stock">⬇ Excel</button>
        <button class="btn small" data-export="pdf" data-source="stock">⬇ PDF</button>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Stock ID</th><th>Shape</th><th class="num">Size (ct)</th><th>Colour</th><th>Purity</th>
          <th>Lab</th><th>Location</th><th>Status</th><th></th>
        </tr></thead>
        <tbody id="stockTableBody"></tbody>
      </table>
    </div>
  </section>

  <!-- PURCHASES -->
  <section class="panel" id="panel-purchases">
    <div class="section-head">
      <h2 class="serif">Purchases<span class="count" id="purchaseCount"></span></h2>
      <div class="head-actions">
        <button class="btn small" data-export="csv" data-source="purchases">⬇ CSV</button>
        <button class="btn small" data-export="xlsx" data-source="purchases">⬇ Excel</button>
        <button class="btn small" data-export="pdf" data-source="purchases">⬇ PDF</button>
        <button class="btn primary small" id="btnAddPurchase">+ New purchase</button>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Stock ID</th><th>Date</th><th>Party</th><th>Broker</th><th>Shape</th><th class="num">Size</th>
          <th class="num">Rap $/ct</th><th class="num">Disc %</th><th class="num">Total ₹</th><th>Paid</th><th></th>
        </tr></thead>
        <tbody id="purchaseTableBody"></tbody>
      </table>
    </div>
  </section>

</main>

<!-- Add Purchase Modal -->
<div class="overlay" id="overlayPurchase">
  <div class="modal">
    <h3 class="serif">New purchase</h3>
    <div class="modal-sub">Creates the stone in stock and records the purchase.</div>
    <div class="form-grid">
      <div><label>Stock ID (auto)</label><input id="p_stockId" readonly></div>
      <div><label>Date</label><input id="p_date" type="date"></div>
      <div><label>Shape</label>
        <select id="p_shape">
          <option>ROUND</option><option>PRINCESS</option><option>OVAL</option><option>CUSHION</option>
          <option>EMERALD</option><option>PEAR</option><option>MARQUISE</option><option>RADIANT</option>
        </select>
      </div>
      <div><label>Size (ct)</label><input id="p_size" type="number" step="0.01" placeholder="0.50"></div>
      <div><label>Colour</label>
        <select id="p_colour"><option>D</option><option>E</option><option>F</option><option>G</option><option>H</option><option>I</option><option>J</option></select>
      </div>
      <div><label>Purity</label>
        <select id="p_purity"><option>IF</option><option>VVS1</option><option>VVS2</option><option>VS1</option><option>VS2</option><option>SI1</option><option>SI2</option></select>
      </div>
      <div><label>Lab</label>
        <select id="p_lab"><option>GIA</option><option>IGI</option><option>HRD</option></select>
      </div>
      <div><label>Location</label><input id="p_location" placeholder="e.g. SURAT"></div>
      <div><label>Party (seller)</label><input id="p_party" placeholder="e.g. AKSHAY"></div>
      <div><label>Broker</label><input id="p_broker" placeholder="e.g. NISHIT"></div>
      <div><label>Partner (co-owner)</label><input id="p_partner" placeholder="e.g. AKSHAY"></div>
      <div class="full">
        <label>Rap rate ($/ct)</label>
        <div style="display:flex; gap:16px; margin-bottom:6px;">
          <label style="display:flex; align-items:center; gap:5px; font-size:12.5px; font-weight:500; color:var(--ink-soft); margin-bottom:0;">
            <input type="radio" name="p_rap_mode" id="p_rap_auto" checked style="width:auto;"> Auto (Rapaport)
          </label>
          <label style="display:flex; align-items:center; gap:5px; font-size:12.5px; font-weight:500; color:var(--ink-soft); margin-bottom:0;">
            <input type="radio" name="p_rap_mode" id="p_rap_manual" style="width:auto;"> Manual entry
          </label>
        </div>
        <input id="p_rap" type="number" step="0.01" placeholder="1800">
        <div id="p_rap_note" style="font-size:11.5px; color:var(--ink-faint); margin-top:5px;"></div>
      </div>
      <div><label>Discount (%)</label><input id="p_discount" type="number" step="0.01" placeholder="55"></div>
      <div><label>Less (%)</label><input id="p_less" type="number" step="0.01" placeholder="2"></div>
      <div><label>$ Rate (₹ per $)</label><input id="p_dollarrate" type="number" step="0.01" placeholder="83"></div>
      <div><label>GST (%)</label><input id="p_gst" type="number" step="0.01" placeholder="3"></div>
      <div><label>Expenses (₹)</label><input id="p_expenses" type="number" step="0.01" placeholder="0"></div>
      <div><label>Paid</label>
        <select id="p_paid"><option value="Y">Yes</option><option value="N">Not paid</option></select>
      </div>
      <div class="full">
        <label>Total amount (₹) — auto-calculated</label>
        <input id="p_total" type="number" step="0.01" readonly>
        <div id="p_total_note" style="font-size:11.5px; color:var(--ink-faint); margin-top:5px;"></div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn" data-close="overlayPurchase">Cancel</button>
      <button class="btn primary" id="savePurchase">Save purchase</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch(e) { console.warn("Could not save data.", e); showToast("Couldn't save — storage unavailable."); }
  }

  var state = loadState();

  function ensureNextSeq(){
    if (!state.nextSeq){
      var maxNum = 105;
      state.stones.forEach(function(s){
        var m = /(\d+)\s*$/.exec(s.stockId || "");
        if (m) maxNum = Math.max(maxNum, parseInt(m[1], 10));
      });
      state.nextSeq = maxNum + 1;
      saveState(state);
    }
  }
  ensureNextSeq();
  function nextStockId(){ return "AK" + state.nextSeq; }

  // ---------- Theme ----------
  function initTheme(){
    var saved = null;
    try { saved = localStorage.getItem(THEME_KEY); } catch(e){}
    if (saved === "light" || saved === "dark") document.documentElement.setAttribute("data-theme", saved);
  }
  function toggleTheme(){
    var current = document.documentElement.getAttribute("data-theme");
    var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    var effectiveCurrent = current || (prefersDark ? "dark" : "light");
    var next = effectiveCurrent === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem(THEME_KEY, next); } catch(e){}
  }
  initTheme();
  document.getElementById("themeToggle").addEventListener("click", toggleTheme);

  // ---------- Toast ----------
  var toastTimer = null;
  function showToast(msg){
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove("show"); }, 2600);
  }

  // ---------- Tabs ----------
  var tabButtons = document.querySelectorAll("#tabStrip button");
  tabButtons.forEach(function(btn){
    btn.addEventListener("click", function(){
      tabButtons.forEach(function(b){ b.classList.remove("active"); });
      btn.classList.add("active");
      document.querySelectorAll(".panel").forEach(function(p){ p.classList.remove("active"); });
      document.getElementById("panel-" + btn.dataset.tab).classList.add("active");
    });
  });

  // ---------- Modal helpers ----------
  function openModal(id){ document.getElementById(id).classList.add("open"); }
  function closeModal(id){ document.getElementById(id).classList.remove("open"); }
  document.querySelectorAll("[data-close]").forEach(function(btn){
    btn.addEventListener("click", function(){ closeModal(btn.dataset.close); });
  });
  document.querySelectorAll(".overlay").forEach(function(ov){
    ov.addEventListener("click", function(e){ if (e.target === ov) ov.classList.remove("open"); });
  });

  // ---------- Derived helpers ----------
  function findStone(stockId){ return state.stones.find(function(s){ return s.stockId === stockId; }); }
  function findPurchase(stockId){ return state.purchases.find(function(p){ return p.stockId === stockId; }); }

  // ---------- Renderers ----------
  function renderAll(){
    renderStock();
    renderPurchases();
  }

  function renderStock(){
    document.getElementById("stockCount").textContent = " (" + state.stones.length + ")";
    var body = document.getElementById("stockTableBody");
    if (state.stones.length === 0){
      body.innerHTML = '<tr><td colspan="9" class="empty">No stones yet. Add a purchase to bring stock in.</td></tr>';
      return;
    }
    body.innerHTML = state.stones.map(function(s){
      var badgeCls = s.status === "In Stock" ? "in-stock" : "sold";
      return '<tr><td class="mono">'+s.stockId+'</td><td>'+s.shape+'</td><td class="num mono">'+s.size.toFixed(2)+'</td>'+
        '<td>'+s.colour+'</td><td>'+s.purity+'</td><td>'+s.lab+'</td><td>'+s.location+'</td>'+
        '<td><span class="badge '+badgeCls+'">'+s.status+'</span></td>'+
        '<td class="actions-cell"><button class="row-del" data-type="stone" data-id="'+s.stockId+'" title="Delete">🗑</button></td></tr>';
    }).join("");
  }

  function renderPurchases(){
    document.getElementById("purchaseCount").textContent = " (" + state.purchases.length + ")";
    var body = document.getElementById("purchaseTableBody");
    if (state.purchases.length === 0){
      body.innerHTML = '<tr><td colspan="11" class="empty">No purchases recorded yet.</td></tr>';
      return;
    }
    var sorted = state.purchases.slice().sort(function(a,b){ return b.date.localeCompare(a.date); });
    body.innerHTML = sorted.map(function(p){
      var stone = findStone(p.stockId) || {};
      var paidCls = p.paid === "Y" ? "paid" : "not-paid";
      var paidLabel = p.paid === "Y" ? "Paid" : "Not paid";
      return '<tr><td class="mono">'+p.stockId+'</td><td>'+fmtDate(p.date)+'</td><td>'+p.party+'</td><td>'+p.broker+'</td>'+
        '<td>'+(stone.shape||"—")+'</td><td class="num mono">'+(stone.size!==undefined?stone.size.toFixed(2):"—")+'</td>'+
        '<td class="num mono">'+fmtUSD(p.rap)+'</td><td class="num mono">'+p.discount+'%</td>'+
        '<td class="num mono">'+fmtINR(p.total)+'</td><td><span class="badge '+paidCls+'">'+paidLabel+'</span></td>'+
        '<td class="actions-cell"><button class="row-del" data-type="purchase" data-id="'+p.id+'" title="Delete">🗑</button></td></tr>';
    }).join("");
  }

  // ---------- Rap rate: auto (Rapaport) vs manual ----------
  function updateRapField(){
    var rapInput = document.getElementById("p_rap");
    var note = document.getElementById("p_rap_note");
    var auto = document.getElementById("p_rap_auto").checked;
    if (!auto){
      rapInput.readOnly = false;
      note.textContent = "Manual entry.";
      updateTotalField();
      return;
    }
    var shape = document.getElementById("p_shape").value;
    var color = document.getElementById("p_colour").value;
    var purity = document.getElementById("p_purity").value;
    var size = document.getElementById("p_size").value;
    var rate = findRapRate(shape, color, purity, size);
    var rapShapeLabel = (shape === "ROUND") ? "ROUND" : "PS (Pear Shape — used for all non-Round shapes)";
    rapInput.readOnly = true;
    if (rate !== null){
      rapInput.value = rate;
      note.textContent = "Auto-filled from Rapaport price sheet, " + rapShapeLabel + " " + color + "/" + purity + " (updated " + RAP_LAST_UPDATED + ").";
    } else {
      rapInput.value = "";
      note.textContent = "No Rapaport data for " + rapShapeLabel + " " + color + "/" + purity + (size ? " at " + size + "ct" : "") + " — switch to manual entry.";
    }
    updateTotalField();
  }
  ["p_shape","p_colour","p_purity","p_size"].forEach(function(id){
    document.getElementById(id).addEventListener("input", updateRapField);
    document.getElementById(id).addEventListener("change", updateRapField);
  });
  document.getElementById("p_rap_auto").addEventListener("change", updateRapField);
  document.getElementById("p_rap_manual").addEventListener("change", updateRapField);

  // ---------- Total amount: auto-calculated ----------
  function updateTotalField(){
    var size = parseFloat(document.getElementById("p_size").value) || 0;
    var discount = parseFloat(document.getElementById("p_discount").value) || 0;
    var less = parseFloat(document.getElementById("p_less").value) || 0;
    var dollarRate = parseFloat(document.getElementById("p_dollarrate").value) || 0;
    var gst = parseFloat(document.getElementById("p_gst").value) || 0;
    var expenses = parseFloat(document.getElementById("p_expenses").value) || 0;
    var rap = parseFloat(document.getElementById("p_rap").value) || 0;

    var withoutGST = size * (1 - discount/100) * (1 - less/100) * dollarRate * rap;
    var withGST = withoutGST * (1 + gst/100);
    var finalTotal = withGST - expenses;

    document.getElementById("p_total").value = finalTotal ? finalTotal.toFixed(2) : "";
    document.getElementById("p_total_note").textContent =
      "Without GST: " + fmtINR(withoutGST) + "  ·  With GST: " + fmtINR(withGST) +
      (expenses ? "  ·  Less expenses " + fmtINR(expenses) + " = " + fmtINR(finalTotal) : "");
  }
  ["p_size","p_discount","p_less","p_dollarrate","p_gst","p_expenses","p_rap"].forEach(function(id){
    document.getElementById(id).addEventListener("input", updateTotalField);
  });

  // ---------- Add Purchase ----------
  document.getElementById("btnAddPurchase").addEventListener("click", function(){
    document.getElementById("p_stockId").value = nextStockId();
    document.getElementById("p_date").value = todayISO();
    document.getElementById("p_size").value = "";
    document.getElementById("p_location").value = "";
    document.getElementById("p_party").value = "";
    document.getElementById("p_broker").value = "";
    document.getElementById("p_partner").value = "";
    document.getElementById("p_rap_auto").checked = true;
    document.getElementById("p_discount").value = "";
    document.getElementById("p_less").value = "";
    document.getElementById("p_dollarrate").value = "";
    document.getElementById("p_gst").value = "";
    document.getElementById("p_expenses").value = "";
    document.getElementById("p_total").value = "";
    document.getElementById("p_total_note").textContent = "";
    updateRapField();
    openModal("overlayPurchase");
  });

  document.getElementById("savePurchase").addEventListener("click", function(){
    var stockId = document.getElementById("p_stockId").value.trim();
    if (!stockId){ showToast("Stock ID is required."); return; }
    if (findStone(stockId)){ showToast("That Stock ID already exists."); return; }
    var size = parseFloat(document.getElementById("p_size").value) || 0;
    var total = parseFloat(document.getElementById("p_total").value) || 0;
    var partnerName = document.getElementById("p_partner").value.trim();

    state.stones.push({
      stockId: stockId,
      shape: document.getElementById("p_shape").value,
      size: size,
      colour: document.getElementById("p_colour").value,
      purity: document.getElementById("p_purity").value,
      lab: document.getElementById("p_lab").value,
      location: document.getElementById("p_location").value.trim() || "—",
      status: "In Stock"
    });
    state.purchases.push({
      id: uid("PU-"),
      stockId: stockId,
      date: document.getElementById("p_date").value || todayISO(),
      party: document.getElementById("p_party").value.trim() || "—",
      broker: document.getElementById("p_broker").value.trim() || "—",
      partner: partnerName || "—",
      rap: parseFloat(document.getElementById("p_rap").value) || 0,
      discount: parseFloat(document.getElementById("p_discount").value) || 0,
      less: parseFloat(document.getElementById("p_less").value) || 0,
      dollarRate: parseFloat(document.getElementById("p_dollarrate").value) || 0,
      gst: parseFloat(document.getElementById("p_gst").value) || 0,
      expenses: parseFloat(document.getElementById("p_expenses").value) || 0,
      total: total,
      paid: document.getElementById("p_paid").value
    });
    state.nextSeq = state.nextSeq + 1;
    saveState(state);
    renderAll();
    closeModal("overlayPurchase");
    showToast("Purchase recorded — " + stockId + " added to stock.");
  });

  // ---------- Delete entries ----------
  function handleRowDelete(type, id){
    if (type === "stone"){
      var stone = findStone(id);
      if (!stone) return;
      if (!confirm("Delete stone " + id + "? This also removes its purchase record.")) return;
      state.stones = state.stones.filter(function(s){ return s.stockId !== id; });
      state.purchases = state.purchases.filter(function(p){ return p.stockId !== id; });
      saveState(state);
      renderAll();
      showToast("Stone " + id + " deleted.");
    } else if (type === "purchase"){
      var p = state.purchases.find(function(x){ return x.id === id; });
      if (!p) return;
      if (!confirm("Delete this purchase (" + p.stockId + ")? The stone will be removed from inventory too.")) return;
      state.purchases = state.purchases.filter(function(x){ return x.id !== id; });
      state.stones = state.stones.filter(function(s){ return s.stockId !== p.stockId; });
      saveState(state);
      renderAll();
      showToast("Purchase deleted.");
    }
  }
  document.addEventListener("click", function(e){
    var btn = e.target.closest(".row-del");
    if (!btn) return;
    handleRowDelete(btn.dataset.type, btn.dataset.id);
  });

  // ---------- Export ----------
  var downloadsCap = null;
  (function initDownloads(){
    if (!window.claude || !window.claude.use){ return; }
    window.claude.use("downloads").then(function(cap){ downloadsCap = cap; });
  })();

  function stampFilename(base, ext){
    var d = new Date();
    var pad = function(n){ return (n<10?"0":"")+n; };
    var stamp = d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
    return base + "-" + stamp + "." + ext;
  }

  function getExportData(source){
    if (source === "stock"){
      return {
        title: "Stock",
        headers: ["Stock ID","Shape","Size (ct)","Colour","Purity","Lab","Location","Status"],
        rows: state.stones.map(function(s){
          return [s.stockId, s.shape, s.size.toFixed(2), s.colour, s.purity, s.lab, s.location, s.status];
        })
      };
    }
    return {
      title: "Purchases",
      headers: ["Stock ID","Date","Party","Broker","Shape","Size","Rap $/ct","Disc %","Less %","$ Rate","GST %","Expenses ₹","Total ₹","Paid"],
      rows: state.purchases.map(function(p){
        var stone = findStone(p.stockId) || {};
        return [
          p.stockId, p.date, p.party, p.broker, stone.shape || "", stone.size !== undefined ? stone.size.toFixed(2) : "",
          p.rap, p.discount, p.less, p.dollarRate, p.gst, p.expenses, p.total.toFixed(2), p.paid === "Y" ? "Paid" : "Not paid"
        ];
      })
    };
  }

  function csvEscape(v){
    var s = String(v === undefined || v === null ? "" : v);
    if (/[",\n]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  function buildCSV(headers, rows){
    var lines = [headers.map(csvEscape).join(",")];
    rows.forEach(function(r){ lines.push(r.map(csvEscape).join(",")); });
    return lines.join("\r\n");
  }

  function buildXLSX(title, headers, rows){
    var wb = XLSX.utils.book_new();
    var aoa = [headers].concat(rows);
    var ws = XLSX.utils.aoa_to_sheet(aoa);
    ws["!cols"] = headers.map(function(h){ return {wch: Math.max(10, h.length + 2)}; });
    XLSX.utils.book_append_sheet(wb, ws, title.slice(0,31));
    return XLSX.write(wb, {type: "array", bookType: "xlsx"});
  }

  function buildPDF(title, headers, rows){
    var jsPDFCtor = window.jspdf && window.jspdf.jsPDF;
    var doc = new jsPDFCtor({orientation: "landscape", unit: "pt", format: "a4"});
    var marginX = 28, top = 40, rowH = 18, pageW = doc.internal.pageSize.getWidth(), pageH = doc.internal.pageSize.getHeight();
    var usableW = pageW - marginX*2;
    var colW = usableW / headers.length;

    function drawHeaderRow(y){
      doc.setFillColor(30,42,56);
      doc.rect(marginX, y, usableW, rowH, "F");
      doc.setTextColor(255,255,255);
      doc.setFont(undefined, "bold");
      doc.setFontSize(8.5);
      headers.forEach(function(h, i){
        doc.text(String(h), marginX + i*colW + 4, y + rowH - 6, {maxWidth: colW - 6});
      });
      doc.setTextColor(20,20,20);
      doc.setFont(undefined, "normal");
    }

    doc.setFontSize(14);
    doc.setFont(undefined, "bold");
    doc.text(title, marginX, 24);
    doc.setFont(undefined, "normal");
    doc.setFontSize(8.5);
    doc.setTextColor(120,120,120);
    doc.text("Exported " + new Date().toLocaleString(), marginX, 24, {baseline:"top"});
    doc.setTextColor(20,20,20);

    var y = top;
    drawHeaderRow(y);
    y += rowH;

    rows.forEach(function(r, idx){
      if (y + rowH > pageH - 30){
        doc.addPage();
        y = top;
        drawHeaderRow(y);
        y += rowH;
      }
      if (idx % 2 === 1){
        doc.setFillColor(240,236,225);
        doc.rect(marginX, y, usableW, rowH, "F");
      }
      doc.setFontSize(8);
      r.forEach(function(cell, i){
        doc.text(String(cell === undefined || cell === null ? "" : cell), marginX + i*colW + 4, y + rowH - 6, {maxWidth: colW - 6});
      });
      y += rowH;
    });

    return doc.output("arraybuffer");
  }

  function browserBlobDownload(filename, payload, mime){
    var blob = (payload instanceof Blob) ? payload : new Blob([payload], {type: mime});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  }

  var MIME = {
    csv: "text/csv;charset=utf-8",
    xlsx: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
    pdf: "application/pdf"
  };

  function doExport(source, format){
    var data = getExportData(source);
    if (data.rows.length === 0){ showToast("Nothing to export yet."); return; }

    var filename, payload;
    try {
      if (format === "csv"){
        filename = stampFilename(data.title.toLowerCase(), "csv");
        payload = buildCSV(data.headers, data.rows);
      } else if (format === "xlsx"){
        filename = stampFilename(data.title.toLowerCase(), "xlsx");
        payload = buildXLSX(data.title, data.headers, data.rows);
      } else if (format === "pdf"){
        filename = stampFilename(data.title.toLowerCase(), "pdf");
        payload = buildPDF(data.title, data.headers, data.rows);
      }
    } catch(err){
      console.error(err);
      showToast("Couldn't build the " + format.toUpperCase() + " file.");
      return;
    }

    if (downloadsCap){
      // Running inside Claude's artifact viewer — use the platform's save prompt.
      downloadsCap.save({filename: filename, data: payload}).then(function(){
        showToast(data.title + " exported as " + format.toUpperCase() + ".");
      }).catch(function(err){
        if (err && err.code === "declined") return;
        console.error(err);
        showToast("Export was not saved (" + (err && err.code ? err.code : "error") + ").");
      });
    } else {
      // Running in an ordinary browser / wrapped app (e.g. a packaged APK) — use a normal download.
      try {
        browserBlobDownload(filename, payload, MIME[format]);
        showToast(data.title + " exported as " + format.toUpperCase() + ".");
      } catch(err){
        console.error(err);
        showToast("Couldn't start the download.");
      }
    }
  }

  document.querySelectorAll("[data-export]").forEach(function(btn){
    btn.addEventListener("click", function(){
      doExport(btn.dataset.source, btn.dataset.export);
    });
  });

  // ---------- Init ----------
  renderAll();

})();
</script>
</body>
</html>
